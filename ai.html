<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaypratap AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .chat {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            background: white;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            padding: 10px;
            background: white;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #aaa;
        }

        button {
            padding: 12px 18px;
            margin-left: 5px;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🤖 Jaypratap AI</h2>
        <p>My Personal AI Assistant</p>
    </div>

    <div class="chat" id="chat">
        <div class="message">
            🤖 Hello! Main Jaypratap AI hoon.
        </div>
    </div>

    <div class="input-area">
        <input id="message" placeholder="Message likho...">
        <button onclick="sendMessage()">➤ Send</button>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("message");
            let text = input.value.trim();

            if (text === "") return;

            let chat = document.getElementById("chat");

            chat.innerHTML +=
                '<div class="message">👤 ' + text + '</div>';

            chat.innerHTML +=
                '<div class="message">🤖 Abhi main basic version hoon. AI brain baad mein connect karenge! 🚀</div>';

            input.value = "";
        }
    </script>

</body>
</html>
