<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAY AI</title>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#222;color:white;text-align:center;padding:18px}
.chat{max-width:600px;margin:auto;padding:15px 15px 90px}
.msg{background:white;padding:12px;margin:10px 0;border-radius:12px}
.input{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #aaa}
button{padding:11px 14px;margin-left:5px;border:0;border-radius:10px}
</style>
</head>

<body>

<div class="header">
<h2>🤖 JAY AI</h2>
<p>Your Personal AI Assistant</p>
</div>

<div class="chat" id="chat">
<div class="msg">🤖 Hello! Main JAY AI hoon.</div>
</div>

<div class="input">
<input id="message" placeholder="Message likho..."
onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="startVoice()">🎤</button>
<button onclick="sendMessage()">➤</button>
</div>

<script>

async function sendMessage(){

let input=document.getElementById("message");
let text=input.value.trim();

if(!text)return;

let chat=document.getElementById("chat");

let user=document.createElement("div");
user.className="msg";
user.innerText="👤 "+text;
chat.appendChild(user);

input.value="";

let bot=document.createElement("div");
bot.className="msg";
bot.innerText="🤖 Thinking...";
chat.appendChild(bot);

try{

let r=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
});

let data=await r.json();
bot.innerText=data.reply;

}catch(e){

bot.innerText="❌ Backend connection नहीं हुआ।";

}

}

async function startVoice(){

if(!window.SpeechRecognition &&
   !window.webkitSpeechRecognition){

alert("❌ इस Chrome में Voice Recognition उपलब्ध नहीं है।");
return;
}

try{

await navigator.mediaDevices.getUserMedia({audio:true});

let SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition=new SpeechRecognition();

recognition.lang="hi-IN";
recognition.continuous=false;
recognition.interimResults=false;

recognition.onstart=function(){
alert("🎙️ सुन रहा हूँ... अब बोलो!");
};

recognition.onresult=function(event){

let text=event.results[0][0].transcript;

document.getElementById("message").value=text;

sendMessage();

};

recognition.onerror=function(event){

alert("❌ Voice Error: "+event.error);

};

recognition.start();

}catch(e){

alert("❌ Mic start नहीं हुआ। Chrome को microphone permission दो।");

}

}

</script>

</body>
</html>
