<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAY AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2}
.header{background:#222;color:white;padding:18px;text-align:center}
.chat{max-width:600px;margin:20px auto;padding:15px 15px 90px}
.message{padding:12px;margin:10px 0;border-radius:12px;background:white;word-wrap:break-word}
.input-area{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px;background:white}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #aaa}
button{padding:12px 18px;margin-left:5px;border-radius:10px;border:none}
</style>
</head>
<body>
<div class="header">
<h2>🤖 JAY AI</h2>
<p>Your Personal AI Assistant</p>
</div>

<div class="chat" id="chat">
<div class="message">🤖 Hello! Main JAY AI hoon.</div>
</div>

<div class="input-area">
<input id="message" placeholder="Message likho..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">➤ Send</button>
</div>

<script>
async function sendMessage(){
    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text)return;

    const chat=document.getElementById("chat");
    chat.innerHTML += '<div class="message">👤 '+escapeHtml(text)+'</div>';
    input.value="";

    const thinking=document.createElement("div");
    thinking.className="message";
    thinking.textContent="🤖 Thinking...";
    chat.appendChild(thinking);
    window.scrollTo(0,document.body.scrollHeight);

    try{
        const response=await fetch("http://127.0.0.1:5000/chat",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:text})
        });
        if(!response.ok)throw new Error("Server error");
        const data=await response.json();
        thinking.textContent=data.reply || "🤖 कोई जवाब नहीं मिला।";
    }catch(error){
        thinking.textContent="❌ Backend से connection नहीं हो पाया।";
    }
}

function escapeHtml(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}
</script>
</body>
</html>
