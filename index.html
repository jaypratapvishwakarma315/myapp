<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>❤️ Love Heart</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#000;
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 font-family:Arial,sans-serif;
}

.box{
 width:100%;
 max-width:600px;
 text-align:center;
}

h1{
 font-size:32px;
 color:#f4c4e4;
 text-shadow:0 0 15px #ff7dcc;
}

.heart{
 width:300px;
 height:270px;
 margin:30px auto;
 position:relative;
 animation:beat 1s infinite;
 filter:drop-shadow(0 0 18px #ff8bd4);
}

.heart:before,
.heart:after{
 content:"";
 position:absolute;
 top:0;
 width:150px;
 height:240px;
 border:4px solid #f49acb;
 border-bottom:0;
 border-radius:150px 150px 0 0;
}

.heart:before{
 left:150px;
 transform:rotate(45deg);
 transform-origin:0 100%;
}

.heart:after{
 left:0;
 transform:rotate(-45deg);
 transform-origin:100% 100%;
}

.words{
 position:absolute;
 width:270px;
 height:250px;
 left:15px;
 top:10px;
 overflow:hidden;
 z-index:5;
}

.word{
 display:inline-block;
 color:#ffadd8;
 font-size:13px;
 margin:2px;
 text-shadow:0 0 8px white;
 transform:rotate(-30deg);
 animation:float 4s linear infinite;
}

@keyframes beat{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.08)}
}

@keyframes float{
 from{transform:translateY(120px) rotate(-30deg);opacity:0}
 30%{opacity:1}
 to{transform:translateY(-150px) rotate(-30deg);opacity:0}
}

.love{
 font-size:25px;
 margin-top:25px;
}

button{
 background:#ff9ed2;
 border:0;
 padding:13px 28px;
 border-radius:30px;
 font-size:17px;
 margin-top:20px;
 box-shadow:0 0 20px #ff9ed2;
}

#msg{
 margin-top:20px;
 color:#ffacd7;
 font-size:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>Love Heart Animation ❤️</h1>

<div class="heart">
 <div class="words" id="words"></div>
</div>

<div class="love">❤️ I LOVE YOU ❤️</div>

<button onclick="love()">Click for Love 💕</button>

<div id="msg"></div>

</div>

<script>

const words=document.getElementById("words");

for(let i=0;i<100;i++){
 let s=document.createElement("span");
 s.className="word";
 s.innerText="I love you";
 s.style.animationDelay=(Math.random()*4)+"s";
 words.appendChild(s);
}

function love(){
 document.getElementById("msg").innerText=
 "💖 Love is beautiful 💖";
}

</script>

</body>
</html>
