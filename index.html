<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Heart ❤️</title>
<style>
body{
margin:0;background:#000;color:white;min-height:100vh;
display:flex;justify-content:center;align-items:center;
overflow:hidden;font-family:Arial;text-align:center
}
h1{color:#ff9ed2;text-shadow:0 0 20px #ff4da6}
.heart{
font-size:100px;
animation:beat 1s infinite;
filter:drop-shadow(0 0 20px #ff1493)
}
.love{color:#ff9ed2;font-size:24px}
button{
padding:12px 25px;border:0;border-radius:25px;
background:#ff9ed2;font-size:18px;margin-top:20px
}
@keyframes beat{
50%{transform:scale(1.15)}
}
</style>
</head>
<body>
<div>
<h1>❤️ Love Heart Animation ❤️</h1>
<div class="heart">💗</div>
<div class="love">I LOVE YOU ❤️</div>
<button onclick="alert('❤️ My Cutie 😘👸 ❤️')">Click Me 💕</button>
</div>
</body>
</html>
