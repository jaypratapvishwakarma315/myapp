<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 text-align:center;
 color:white;
 background:linear-gradient(135deg,#ff1493,#6a00ff,#00bfff);
 background-size:400% 400%;
 animation:bg 8s infinite;
}

@keyframes bg{
 0%{background-position:0 50%}
 50%{background-position:100% 50%}
 100%{background-position:0 50%}
}

.container{
 padding:35px 15px;
}

h1{
 font-size:40px;
 text-shadow:0 0 20px white;
}

.name{
 font-size:32px;
 font-weight:bold;
 color:#ffe600;
}

.message{
 font-size:20px;
 margin:20px 0;
}

button{
 padding:15px 28px;
 border:0;
 border-radius:30px;
 font-size:19px;
 font-weight:bold;
 color:#ff1493;
 background:white;
 box-shadow:0 0 20px white;
}

#surprise{
 display:none;
 margin:20px 0;
 font-size:23px;
}

.gallery{
 margin-top:30px;
}

.gallery h2{
 font-size:30px;
}

.photo{
 width:90%;
 max-width:350px;
 border-radius:20px;
 margin:10px;
 border:4px solid white;
 box-shadow:0 0 20px white;
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<div class="name">My Cutie 😘👸</div>

<div class="message">
🎉 जन्मदिन की बहुत-बहुत शुभकामनाएँ 🎉
<br>
✨ हमेशा खुश रहो ✨
</div>

<button onclick="showMessage()">
🎁 Click Me 🎁
</button>

<div id="surprise">
❤️ Happy Birthday My Cutie 😘👸 ❤️
<br>
🎉 Have a Beautiful Day! 🎉
</div>

<div class="gallery">
<h2>📸 My Gallery ❤️</h2>

<img class="photo"
src="Screenshot_20260911-114009.png"
alt="Birthday Photo">

</div>

</div>

<script>
function showMessage(){
 document.getElementById("surprise").style.display="block";
}
</script>

</body>
</html>
