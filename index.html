<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 overflow:hidden;
 background:radial-gradient(circle,#24104d,#05000d 70%);
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.container{
 position:relative;
 z-index:5;
 padding:20px;
}

.small{
 font-size:20px;
 color:#ffd6f6;
}

h1{
 font-size:42px;
 margin:10px 0;
 color:#fff;
 text-shadow:0 0 10px #ff69b4,0 0 30px #ff1493;
 animation:glow 1.2s infinite alternate;
}

.name{
 font-size:34px;
 color:#ffe08a;
 text-shadow:0 0 15px #ffd700,0 0 35px #ff9800;
 animation:pop 1.5s infinite alternate;
}

.cake{
 position:relative;
 width:180px;
 height:130px;
 margin:30px auto 20px;
}

.plate{
 position:absolute;
 bottom:0;
 left:0;
 width:180px;
 height:18px;
 background:#eee;
 border-radius:50%;
}

.layer{
 position:absolute;
 left:20px;
 bottom:15px;
 width:140px;
 height:70px;
 background:#ff75ad;
 border-radius:12px 12px 20px 20px;
 box-shadow:0 8px 0 #d84b87;
}

.cream{
 position:absolute;
 top:45px;
 left:20px;
 width:140px;
 height:25px;
 background:#fff;
 border-radius:50%;
}

.candle{
 position:absolute;
 top:5px;
 left:82px;
 width:16px;
 height:45px;
 background:#75d9ff;
 border-radius:4px;
}

.flame{
 position:absolute;
 top:-25px;
 left:2px;
 font-size:25px;
 animation:flame .5s infinite alternate;
}

.balloon{
 position:absolute;
 font-size:50px;
 animation:float 5s ease-in-out infinite;
}

.b1{left:5%;top:10%}
.b2{right:6%;top:15%;animation-delay:1s}
.b3{left:10%;bottom:10%;animation-delay:2s}
.b4{right:10%;bottom:8%;animation-delay:3s}

button{
 margin-top:20px;
 padding:14px 30px;
 border:0;
 border-radius:30px;
 font-size:18px;
 background:#ff69b4;
 color:white;
 box-shadow:0 0 20px #ff1493;
}

#message{
 margin-top:18px;
 font-size:22px;
 color:#ffd6f6;
}

.confetti{
 position:absolute;
 top:-20px;
 font-size:20px;
 animation:fall linear infinite;
}

@keyframes glow{
 from{transform:scale(1)}
 to{transform:scale(1.05)}
}

@keyframes pop{
 from{transform:scale(1)}
 to{transform:scale(1.1)}
}

@keyframes float{
 50%{transform:translateY(-30px) rotate(8deg)}
}

@keyframes flame{
 to{transform:scale(1.3)}
}

@keyframes fall{
 to{transform:translateY(110vh) rotate(720deg)}
}
</style>
</head>

<body>

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div>
<div class="balloon b4">🎈</div>

<div class="container">

<div class="small">🎉 आज का दिन बहुत खास है 🎉</div>

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<div class="name">My Cutie 😘👸</div>

<div class="cake">
 <div class="candle">
   <div class="flame">🔥</div>
 </div>
 <div class="cream"></div>
 <div class="layer"></div>
 <div class="plate"></div>
</div>

<div id="message">💖 Wishing you lots of happiness 💖</div>

<button onclick="birthday()">🎁 Click Me 🎁</button>

</div>

<script>
function birthday(){
 document.getElementById("message").innerHTML =
 "🎉 Happy Birthday My Cutie 😘👸 ❤️";

 for(let i=0;i<80;i++){
   let c=document.createElement("div");
   c.className="confetti";
   c.innerHTML=["🎉","✨","❤️","💖","🎊","⭐"][Math.floor(Math.random()*6)];
   c.style.left=Math.random()*100+"vw";
   c.style.animationDuration=(2+Math.random()*4)+"s";
   c.style.animationDelay=Math.random()*2+"s";
   document.body.appendChild(c);

   setTimeout(()=>c.remove(),7000);
 }
}

for(let i=0;i<25;i++){
 let c=document.createElement("div");
 c.className="confetti";
 c.innerHTML=["✨","❤️","⭐"][Math.floor(Math.random()*3)];
 c.style.left=Math.random()*100+"vw";
 c.style.animationDuration=(4+Math.random()*5)+"s";
 c.style.animationDelay=Math.random()*5+"s";
 document.body.appendChild(c);
}
</script>

</body>
</html>
EOF
