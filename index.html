<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-family:Arial;
color:white;
background:linear-gradient(135deg,#ff1493,#6a00ff);
overflow:hidden;
}
.box{padding:20px}
h1{font-size:40px;text-shadow:0 0 20px white}
.name{font-size:32px;color:#ffe600}
.cake{font-size:100px;margin:20px}
button{
padding:15px 30px;
font-size:20px;
border:0;
border-radius:30px;
background:white;
color:#ff1493;
}
#msg{font-size:22px;margin:20px}
</style>
</head>

<body>

<div class="box">

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<div class="name">My Cutie 😘👸</div>

<div class="cake">🎂</div>

<div id="msg">💖 Wishing you lots of happiness 💖</div>

<button onclick="show()">🎁 Click Me 🎁</button>

</div>

<script>
function show(){
document.getElementById("msg").innerHTML=
"🎉 Happy Birthday My Cutie 😘👸 ❤️🎉";
}
</script>

</body>
</html>
