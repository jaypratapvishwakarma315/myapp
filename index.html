
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart Animation ❤️</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:600px;
  text-align:center;
}

h1{
  color:#f2c7e5;
  font-size:32px;
  margin-bottom:30px;
  text-shadow:0 0 15px #ff8bd8;
}

.heart{
  position:relative;
  width:300px;
  height:270px;
  margin:auto;
  filter:drop-shadow(0 0 12px #ff8bd8);
  animation:beat 1.2s infinite;
}

/* Heart shape */
.heart::before,
.heart::after{
  content:"";
  position:absolute;
  top:0;
  width:150px;
  height:240px;
  border:4px solid #f39acb;
  border-radius:150px 150px 0 0;
  border-bottom:0;
}

.heart::before{
  left:150px;
  transform:rotate(45deg);
  transform-origin:0 100%;
}

.heart::after{
  left:0;
  transform:rotate(-45deg);
  transform-origin:100% 100%;
}

.words{
  position:absolute;
  inset:25px 25px 20px;
  overflow:hidden;
  color:#f5a9d3;
  font-size:13px;
  line-height:16px;
  text-align:center;
  opacity:.9;
  animation:move 5s linear infinite;
}

.words span{
  display:inline-block;
  margin:2px;
  transform:rotate(-30deg);
  text-shadow:0 0 8px white;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

@keyframes move{
  0%{transform:translateY(20px)}
  100%{transform:translateY(-120px)}
}

.love{
  margin-top:35px;
  color:white;
  font-size:24px;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#f39acb;
  color:#000;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 0 15px #f39acb;
}
</style>
</head>

<body>

<div class="container">

<h1>Love Heart Animation ❤️</h1>

<div class="heart">
  <div class="words" id="words"></div>
</div>

<div class="love">
  ❤️ I Love You ❤️
</div>

<button onclick="createLove()">Click for Love 💕</button>

</div>

<script>
const words = document.getElementById("words");

function createLove(){
  words.innerHTML = "";

  for(let i=0;i<80;i++){
    const span = document.createElement("span");
    span.innerText = "I love you";
    words.appendChild(span);
  }
}

createLove();
</script>

</body>
</html>
