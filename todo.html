<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaypratap To-Do</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            margin: 5px;
            border-radius: 8px;
        }

        li {
            margin: 10px;
            list-style: none;
        }

        .done {
            text-decoration: line-through;
        }

        .dark {
            background: #111;
            color: white;
        }

        .dark .box {
            background: #222;
        }
    </style>
</head>

<body>

    <button onclick="darkMode()">🌙 Dark Mode</button>

    <div class="box">
        <h1>📝 Jaypratap To-Do</h1>

        <input id="task" placeholder="Task likho">
        <button onclick="addTask()">➕ Add</button>

        <h3>Tasks: <span id="count">0</span></h3>

        <ul id="list"></ul>

        <button onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function showTasks() {
            let list = document.getElementById("list");
            list.innerHTML = "";

            tasks.forEach(function(task, index) {

                let item = document.createElement("li");

                if (task.done) {
                    item.classList.add("done");
                }

                item.innerText = task.text;

                let doneButton = document.createElement("button");
                doneButton.innerText = "✅ Done";

                doneButton.onclick = function() {
                    tasks[index].done = !tasks[index].done;
                    saveTasks();
                    showTasks();
                };

                let deleteButton = document.createElement("button");
                deleteButton.innerText = "🗑️ Delete";

                deleteButton.onclick = function() {
                    tasks.splice(index, 1);
                    saveTasks();
                    showTasks();
                };

                item.appendChild(doneButton);
                item.appendChild(deleteButton);

                list.appendChild(item);
            });

            document.getElementById("count").innerText = tasks.length;
        }

        function addTask() {
            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Pehle task likho!");
                return;
            }

            tasks.push({
                text: task,
                done: false
            });

            saveTasks();

            document.getElementById("task").value = "";

            showTasks();
        }

        function clearAll() {
            tasks = [];
            saveTasks();
            showTasks();
        }

        function darkMode() {
            document.body.classList.toggle("dark");
        }

        showTasks();
    </script>

</body>
</html>
