<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaypratap To-Do</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .box {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            margin: 5px;
            border-radius: 8px;
        }

        li {
            margin: 10px;
            list-style: none;
        }

        .done {
            text-decoration: line-through;
        }

        .dark {
            background: #111;
            color: white;
        }

        .dark .box {
            background: #222;
        }
    </style>
</head>

<body>

    <button onclick="darkMode()">🌙 Dark Mode</button>

    <div class="box">
        <h1>📝 Jaypratap To-Do</h1>

        <input id="task" placeholder="Task likho">
        <button onclick="addTask()">➕ Add</button>

        <h3>Tasks: <span id="count">0</span></h3>

        <ul id="list"></ul>

        <button onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <script>
        let total = 0;
let savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
        function darkMode() {
            document.body.classList.toggle("dark");
        }

        function addTask() {
            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Pehle task likho!");
                return;
            }

            let item = document.createElement("li");
            item.innerText = task;

            let doneButton = document.createElement("button");
            doneButton.innerText = "✅ Done";

            doneButton.onclick = function() {
                item.classList.toggle("done");
            };

            let deleteButton = document.createElement("button");
            deleteButton.innerText = "🗑️ Delete";

            deleteButton.onclick = function() {
                item.remove();
                total--;
                document.getElementById("count").innerText = total;
            };

            item.appendChild(doneButton);
            item.appendChild(deleteButton);

            document.getElementById("list").appendChild(item);

            total++;
            document.getElementById("count").innerText = total;

            document.getElementById("task").value = "";
        }

        function clearAll() {
            document.getElementById("list").innerHTML = "";
            total = 0;
            document.getElementById("count").innerText = total;
        }
    </script>

</body>
</html>
